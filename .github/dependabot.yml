version: 2
updates:
  # One entry per workspace — this is a multi-workspace repo, and a single
  # root-level entry does not cover the sub-package.json files.
  #
  # Each npm directory splits updates into two groups by update type. Majors are a
  # deliberate, scheduled upgrade rather than a drive-by merge: 21 of the 22 open
  # Dependabot PRs were major bumps, and the ones that DO run CI fail it (tailwind 4
  # breaks `test (20.x)`, prisma 7 fails the vulnerability scan). Grouping keeps them
  # visible as one reviewable PR per directory instead of ~5 open PRs each, so the
  # signal survives without the noise.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Keep package-lock.json in sync with package.json. Without this, Dependabot
    # bumps package.json and leaves the lockfile stale, so `npm ci` aborts with
    # EUSAGE and CI fails before a single test runs (that is how #635-#641 arrived).
    versioning-strategy: increase

    # TypeScript 7 (the native compiler) is held, not forgotten: it removed
    # tsconfig options this repo still relies on (target ES5, moduleResolution
    # node10, downlevelIteration, baseUrl, non-relative paths), and
    # @typescript-eslint still peers typescript ">=4.8.4 <6.1.0", so `npm ci`
    # dies with ERESOLVE before a single test runs.
    # Remove this ignore when BOTH are true: the tsconfigs are migrated, and the
    # ESLint toolchain accepts TypeScript 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
    labels: ["dependencies"]

  - package-ecosystem: npm
    directory: /client
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    # Keep package-lock.json in sync with package.json. Without this, Dependabot
    # bumps package.json and leaves the lockfile stale, so `npm ci` aborts with
    # EUSAGE and CI fails before a single test runs (that is how #635-#641 arrived).
    versioning-strategy: increase

    # TypeScript 7 (the native compiler) is held, not forgotten: it removed
    # tsconfig options this repo still relies on (target ES5, moduleResolution
    # node10, downlevelIteration, baseUrl, non-relative paths), and
    # @typescript-eslint still peers typescript ">=4.8.4 <6.1.0", so `npm ci`
    # dies with ERESOLVE before a single test runs.
    # Remove this ignore when BOTH are true: the tsconfigs are migrated, and the
    # ESLint toolchain accepts TypeScript 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
    labels: ["dependencies"]

  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    # Keep package-lock.json in sync with package.json. Without this, Dependabot
    # bumps package.json and leaves the lockfile stale, so `npm ci` aborts with
    # EUSAGE and CI fails before a single test runs (that is how #635-#641 arrived).
    versioning-strategy: increase

    # Two held majors, both blocked by tooling rather than by these workspaces.
    #
    # eslint 10 dropped the eslintrc config system (v10.0.0, Feb 2026) and this
    # workspace still uses .eslintrc.*. CI never runs lint ("Static Code
    # Analysis" is skipped), so an eslint 10 merge would look green and break
    # `npm run lint` for everyone. Migrate to flat config, then drop this entry.
    #
    # typescript 7 (the native compiler) removed tsconfig options this repo
    # still relies on (target ES5, moduleResolution node10, downlevelIteration,
    # baseUrl, non-relative paths), and @typescript-eslint still peers
    # typescript ">=4.8.4 <6.1.0", so `npm ci` dies with ERESOLVE first.
    # Drop this entry once the eslint one is gone too.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
    labels: ["dependencies"]

  - package-ecosystem: npm
    directory: /shared
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    # Keep package-lock.json in sync with package.json. Without this, Dependabot
    # bumps package.json and leaves the lockfile stale, so `npm ci` aborts with
    # EUSAGE and CI fails before a single test runs (that is how #635-#641 arrived).
    versioning-strategy: increase

    # TypeScript 7 (the native compiler) is held, not forgotten: it removed
    # tsconfig options this repo still relies on (target ES5, moduleResolution
    # node10, downlevelIteration, baseUrl, non-relative paths), and
    # @typescript-eslint still peers typescript ">=4.8.4 <6.1.0", so `npm ci`
    # dies with ERESOLVE before a single test runs.
    # Remove this ignore when BOTH are true: the tsconfigs are migrated, and the
    # ESLint toolchain accepts TypeScript 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
    labels: ["dependencies"]

  # /cli was missing entirely, so its advisories were never raised as PRs at all —
  # it holds the vitest/vite chain that appears in neither the client nor server entries.
  - package-ecosystem: npm
    directory: /cli
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    # Keep package-lock.json in sync with package.json. Without this, Dependabot
    # bumps package.json and leaves the lockfile stale, so `npm ci` aborts with
    # EUSAGE and CI fails before a single test runs (that is how #635-#641 arrived).
    versioning-strategy: increase

    # Two held majors, both blocked by tooling rather than by these workspaces.
    #
    # eslint 10 dropped the eslintrc config system (v10.0.0, Feb 2026) and this
    # workspace still uses .eslintrc.*. CI never runs lint ("Static Code
    # Analysis" is skipped), so an eslint 10 merge would look green and break
    # `npm run lint` for everyone. Migrate to flat config, then drop this entry.
    #
    # typescript 7 (the native compiler) removed tsconfig options this repo
    # still relies on (target ES5, moduleResolution node10, downlevelIteration,
    # baseUrl, non-relative paths), and @typescript-eslint still peers
    # typescript ">=4.8.4 <6.1.0", so `npm ci` dies with ERESOLVE first.
    # Drop this entry once the eslint one is gone too.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
    labels: ["dependencies"]

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly, day: monday }
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: ["dependencies"]