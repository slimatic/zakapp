version: 2
updates:
  # One entry per workspace — this is a multi-workspace repo, and a single
  # root-level entry does not cover the sub-package.json files.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["*"]
        dependency-type: development
    labels: ["dependencies"]

  - package-ecosystem: npm
    directory: /client
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: npm
    directory: /shared
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: ["dependencies"]

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly, day: monday }
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: ["dependencies"]
