name: Test

on:
  push:
    branches: [ main, develop, copilot/**, release/** ]
  pull_request:
    branches: [ main, develop, release/** ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install root dependencies
      run: npm install

    - name: Install server dependencies
      run: cd server && npm install

    - name: Generate Prisma client
      run: cd server && npx prisma generate

    - name: Install client dependencies
      run: cd client && npm install --legacy-peer-deps

    - name: Run server tests (with coverage gate)
      run: cd server && npm run test:coverage
      env:
        CI: true
        NODE_ENV: test
        ENCRYPTION_KEY: '00000000000000000000000000000000'
        JWT_SECRET: ci-test-jwt-secret-do-not-use-in-production
        DATABASE_URL: file:./test/test.db

    - name: Run client unit tests (with coverage gate)
      run: cd client && npm run test:coverage
      env:
        CI: true

    # Secrets: gitleaks (security-scan.yml) only matches PROVIDER KEY FORMATS - AWS AKIA...,
    # GitHub ghp_..., PEM blocks. It reported "no leaks found" on the full history while a
    # plaintext password sat in three committed scripts (`pg.fill('#password', 'V1Smoke...')`),
    # because a typed password matches no provider format. This step covers that gap by
    # matching credential-shaped names and fill() sinks instead. No dependencies, no build.
    - name: Reject committed credential literals
      run: python3 client/scripts/check-no-committed-credentials.py

    # Coverage thresholds in each vitest config fail the run on a regression, so
    # these steps are the gate itself. The reports are uploaded purely so the
    # numbers are visible when a build does fail.
    - name: Upload server coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-server
        path: server/coverage/
        retention-days: 7

    - name: Upload client coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-client
        path: client/coverage/
        retention-days: 7

    - name: Build client
      run: cd client && npm run build

    - name: Build server
      run: cd server && npm run build

    # Note: Secret scanning, dependency vulnerability scanning, static code
    # analysis, and container security scanning are handled by the dedicated
    # security-scan.yml workflow, which uses professional tools (gitleaks,
    # Snyk, CodeQL, Semgrep, Trivy) and runs conditionally based on changed
    # paths. No need to duplicate them here.

