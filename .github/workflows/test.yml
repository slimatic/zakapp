name: Test

on:
  push:
    branches: [ main, develop, copilot/**, release/** ]
  pull_request:
    branches: [ main, develop, release/** ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history so the whitespace and credential checks can compare
        # against the base branch rather than only the tip.
        fetch-depth: 0

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    # Install: `npm ci` for all five projects. Root and cli lockfiles were
    # previously out of sync with their package.json, so they used `npm install`;
    # both are now verified in sync (`npm ci --dry-run` exits 0), so every
    # project installs strictly from its lockfile.
    - name: Install root dependencies
      run: npm ci

    - name: Install shared dependencies
      run: cd shared && npm ci

    - name: Install server dependencies
      run: cd server && npm ci

    - name: Generate Prisma client
      run: cd server && npx prisma generate

    - name: Install client dependencies
      run: cd client && npm ci --legacy-peer-deps

    - name: Install CLI dependencies
      run: cd cli && npm ci

    - name: Run server tests (with coverage gate)
      run: cd server && npm run test:coverage
      env:
        CI: true
        NODE_ENV: test
        ENCRYPTION_KEY: '00000000000000000000000000000000'
        JWT_SECRET: ci-test-jwt-secret-do-not-use-in-production
        DATABASE_URL: file:./test/test.db

    - name: Run client unit tests (with coverage gate)
      run: cd client && npm run test:coverage
      env:
        CI: true

    # Previously untested in CI even though the v1.0 branch changes both lockfiles.
    #
    # `--if-present` only skips a MISSING script; it does not tolerate a script
    # that runs and finds nothing. `shared` has a `test` script and jest
    # installed but no test files, so plain `jest` exits 1 ("No tests found")
    # and failed this step on every run. `--passWithNoTests` is the right
    # relaxation: a project with no tests yet is not a failure, and a project
    # WITH tests still reports their real result.
    - name: Run shared and CLI tests
      run: |
        cd shared && npm test --if-present -- --passWithNoTests
        cd ../cli && npm test --if-present

    - name: Build client
      run: cd client && npm run build

    - name: Build server
      run: cd server && npm run build

    - name: Build shared and CLI
      run: |
        cd shared && npm run build --if-present
        cd ../cli && npm run build --if-present

    # Runs after the client build on purpose: check-dead-classes.py reads the
    # generated dist/assets/*.css, so it would report false failures without it.
    #
    # Why a custom check exists at all: gitleaks (security-scan.yml) only matches
    # PROVIDER KEY FORMATS - AWS AKIA..., GitHub ghp_..., PEM blocks. It reported
    # "no leaks found" across the full history while a plaintext password sat in
    # three committed scripts, because a typed password matches no provider
    # format. check-no-committed-credentials.py covers that gap, and
    # check-no-credential-logging.py covers bearer/body values written to logs.
    - name: Run source checks (verify:source)
      run: cd client && npm run verify:source

    # Hygiene gate. Keeps generated output and stray edits out of the branch.
    - name: Reject trailing whitespace in the diff
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE="origin/${{ github.base_ref }}"
        else
          BASE="${{ github.event.before }}"
        fi
        git fetch origin "$BASE" --depth=1 2>/dev/null || true
        OUT=$(git diff --check "$BASE"...HEAD 2>&1 || true)
        if [ -n "$OUT" ]; then
          echo "$OUT"
          echo "::error::Trailing whitespace or conflict markers in the diff."
          exit 1
        fi
        echo "No trailing whitespace in the diff."

    # Coverage thresholds in each vitest config fail the run on a regression, so
    # these steps are the gate itself. The reports are uploaded purely so the
    # numbers are visible when a build does fail.
    - name: Upload server coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-server
        path: server/coverage/
        retention-days: 7

    - name: Upload client coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-client
        path: client/coverage/
        retention-days: 7

    # Browser checks (check-mobile-integrity, check-single-shell, check-footer,
    # check-nisab-rows, check-money-alignment, check-reduced-motion,
    # check-theme-a11y-rtl) are NOT wired here yet: they need a served preview
    # plus smoke-test credentials. Run them locally with:
    #   npx vite preview --port 4173 && npm run verify:browser
    # Wiring them into CI requires the seed credential as a repository secret.
    # Note: Secret scanning, dependency vulnerability scanning, static code
    # analysis, and container security scanning are handled by the dedicated
    # security-scan.yml workflow (gitleaks, Snyk, CodeQL, Semgrep, Trivy).
